# Host nginx vhost for theerakarnm.dev. TLS terminates here; the container (compose.yaml) serves plain HTTP on 127.0.0.1:8080.
# Certificates: certbot standard paths. The certificate must cover both theerakarnm.dev and www.theerakarnm.dev.

server {
    listen 80;
    listen [::]:80;
    server_name theerakarnm.dev www.theerakarnm.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://theerakarnm.dev$request_uri;
    }
}

server {
    # nginx >= 1.25.1 may use `http2 on;` instead of the `listen ... http2` flag used here.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.theerakarnm.dev;

    ssl_certificate /etc/letsencrypt/live/theerakarnm.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theerakarnm.dev/privkey.pem;

    return 301 https://theerakarnm.dev$request_uri;
}

server {
    # nginx >= 1.25.1 may use `http2 on;` instead of the `listen ... http2` flag used here.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theerakarnm.dev;

    ssl_certificate /etc/letsencrypt/live/theerakarnm.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theerakarnm.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Brotli needs the ngx_brotli module (e.g. Debian/Ubuntu package libnginx-mod-http-brotli-filter).
    # Uncomment only after `nginx -V` lists it, otherwise nginx refuses to start.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
